spring.application.name=Tesis_proyectoSemilleros

# =====================================================
# SQL Server Connection
# =====================================================
# Crear previamente la base de datos usando el script correspondiente.
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=conectanatural_actividad_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=TU_USUARIO_SQL_SERVER
spring.datasource.password=TU_PASSWORD_SQL_SERVER
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# =====================================================
# JPA / Hibernate
# =====================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false

# =====================================================
# JWT Configuration
# =====================================================
# Sustituir por una clave Base64 segura en el entorno local.
app.jwt.secret=TU_CLAVE_JWT_BASE64
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# =====================================================
# Seeder de usuario ADMIN por defecto
# =====================================================
app.admin.email=admin@ejemplo.com
app.admin.password=CAMBIAR_PASSWORD
app.admin.nombre=Administrador

# =====================================================
# CORS
# =====================================================
app.cors.allowed-origins=http://localhost:*,http://127.0.0.1:*

# =====================================================
# Subida de archivos
# =====================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=uploads

# =====================================================
# Logging
# =====================================================
logging.level.org.springframework.security=INFO
logging.level.com.example.tesis_proyectosemilleros=DEBUG

# =====================================================
# TLS local
# =====================================================
# Debe coincidir con la contraseña utilizada al generar
# src/main/resources/certs/conectanatural-local.p12
app.tls.keystore-password=TU_PASSWORD_DEL_KEYSTORE